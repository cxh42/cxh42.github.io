name: Deploy

on:
  push:
    branches: [master]
  schedule:
    # Hourly rebuild so the visitor globe picks up new places. The site is static and the GoatCounter
    # token must stay secret, so location stats can only be read here, at build time, not in the browser.
    - cron: '17 * * * *'
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs. The build job runs third-party npm code with the
# GoatCounter token in its environment, so it gets read access and nothing that could publish the site.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch visitor stats
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node scripts/fetch-visitors.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing and the other IndexNow engines (Yandex, Naver, Seznam) that the page changed, so they can
  # recrawl it promptly. Pushes only: the hourly rebuild changes nothing but the visitor counts. The key is
  # public by design; it is read back from the deployed site, retrying while the new deploy propagates.
  indexnow:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6; do key=$(curl -fsS https://cxh42.github.io/indexnow-key.txt) && break; sleep 10; done
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' \
            "https://api.indexnow.org/indexnow?url=https://cxh42.github.io/&key=${key}&keyLocation=https://cxh42.github.io/indexnow-key.txt"
